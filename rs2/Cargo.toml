[package]
name = "rs2"
version = "0.1.0"
edition = "2024"

[dependencies]
ordered-float = "5.3.0"
smallvec = "1.15.2"
symbol_table = { version = "0.5.0", features = ["global"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
debug = true

[profile.bench]
debug = true

[profile.test]
debug = true
